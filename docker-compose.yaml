version: '3.9'

services:
  db:
    image: postgres:16
    restart: always
    container_name: db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: bot_db
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  bot:
    build: .
    restart: always
    container_name: pump_dump_bot
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/bot_db
      - TELOXIDE_TOKEN=5661104344:AAHAGcsZ3XmTaO6DXMuuv8DA-XtbMfUi_Ww
      - RUST_LOG=info
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  db_data: