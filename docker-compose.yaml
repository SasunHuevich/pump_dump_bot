version: '3.9'

services:
  db:
    image: postgres:16
    restart: always
    container_name: db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: bot_db
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql

  bot:
    build: .
    container_name: pump_dump_bot
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://user:pass@db:5432/bot_db
      - TELOXIDE_TOKEN=6653096426:AAE5E-9_siiOKT9Pe66j_hXXkS0Js9FAPss
      - RUST_LOG=info

volumes:
  db_data: